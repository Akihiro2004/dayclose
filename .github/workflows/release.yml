name: Build release installer
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify release tag
        run: python release_meta.py $env:RELEASE_TAG
      - name: Build application and installer
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          ./build-installer.ps1
      - name: Create draft release with installer and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = python -c 'from version import APP_VERSION; print(APP_VERSION)'
          gh release create $env:RELEASE_TAG "release/Dayclose-Setup-$version.exe" "release/Dayclose-Setup-$version.exe.sha256" --draft --verify-tag --title "Dayclose $version" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
